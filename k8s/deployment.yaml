apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-management
  template:
    metadata:
      labels:
        app: task-management
    spec:
      containers:
        - name: task-management
          image: flask-devops:task-management
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
